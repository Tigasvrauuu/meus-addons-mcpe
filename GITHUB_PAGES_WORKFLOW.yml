name: Deploy Landing to GitHub Pages

on:
  push:
    branches: [ main, arena/22400437-meus-addons-mcpe ]
    paths:
      - 'landing/**'
      - 'behavior_pack/**'
      - 'resource_pack/**'
      - 'GITHUB_PAGES_WORKFLOW.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: landing
      - run: npm run build
        working-directory: landing
      - uses: actions/upload-pages-artifact@v3
        with:
          path: landing/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
