name: Build Bedrock Add-on
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Confirm reproducible generated content
        run: |
          python3 tools/content.py
          git diff --exit-code -- behavior_pack resource_pack
      - name: Type-check, test, package and validate
        run: npm run ci
      - uses: actions/upload-artifact@v4
        with:
          name: Spider-Man-Definitive-Experience
          path: |
            dist/*.mcaddon
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
